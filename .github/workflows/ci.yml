name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analysis-engine:
    name: Python analysis engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r analysis/requirements.txt
      - run: cd analysis && python3 -m pytest -q

  web:
    name: Next.js frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      # Bundles data/generated/**, data/race-manifest.json,
      # data/fixtures/demo-race.json, and assets/cd-mark.png into
      # apps/web/data/*.json for static import. Run explicitly (not
      # relying on npm's "pre<script>" hooks alone) because the next
      # step invokes eslint directly via npx, which bypasses any
      # "prelint" hook. See docs/DECISIONS.md (2026-08-17).
      - run: npm run generate:data
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run test
      - run: npm run build
      - run: npm run cf:build
      # Boots the real Cloudflare Workers runtime (workerd, via
      # wrangler dev) against the built bundle and asserts real race
      # content is present -- the check that would have caught the
      # 2026-08-17 incident (deployed site rendered zero races) before
      # it ever reached production. See scripts/verify-worker-runtime.mjs.
      - run: npm run verify:worker
