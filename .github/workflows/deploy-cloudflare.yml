name: Deploy RaceIQ to Cloudflare

# Deploys the raceiq-web Worker via `wrangler deploy`. The Worker itself
# always answers at its *.workers.dev subdomain; the production custom
# domain (raceiq.crouchdevelopment.com) is a Cloudflare-dashboard-side
# routing attachment on top of the same Worker, not a separate deploy
# target -- attaching/detaching it is a deliberate manual step this
# workflow does not perform, but once attached (verified 2026-08-18,
# see docs/DECISIONS.md) every deploy here reaches it automatically.
# This workflow verifies both: the workers.dev URL as the underlying
# infrastructure check (decoupled from DNS/custom-domain routing), and
# the custom domain as the actual public production check.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "data/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if Cloudflare credentials are not configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not set. See docs/CURRENT_STATE.md for how to create and add them."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm install

      # Bundles data/generated/**, data/race-manifest.json,
      # data/fixtures/demo-race.json, and assets/cd-mark.png into
      # apps/web/data/*.json for static import -- run explicitly since
      # `npx eslint .` below bypasses npm's "prelint" hook. See
      # docs/DECISIONS.md (2026-08-17).
      - run: npm run generate:data
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run test
      - run: npm run cf:build
      # Boots the real Cloudflare Workers runtime against this exact
      # build before it gets deployed -- the check that would have
      # caught the 2026-08-17 incident (deployed site rendered zero
      # races). See scripts/verify-worker-runtime.mjs.
      - run: npm run verify:worker

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # BREVO_API_KEY is read at request time by /api/subscribe (see
      # apps/web/app/api/subscribe/route.ts), so it must be a Worker
      # runtime secret (wrangler secret put), not a build-time env var --
      # a build-time value would never reach the deployed Worker. This
      # step only runs once BREVO_API_KEY exists as a repo secret; until
      # then the Weekend Brief route keeps failing safely with HTTP 503.
      - name: Sync BREVO_API_KEY to the Worker's runtime secrets
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "BREVO_API_KEY not set -- skipping Worker secret sync."
          else
            echo "$BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY
          fi
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A previous version of this step only checked for HTTP 200 --
      # which is exactly what the 2026-08-17 incident returned while
      # rendering zero races, so it never caught anything. This checks
      # the actual response body for real content, and is unconditional
      # (the earlier version was silently skipped because
      # CLOUDFLARE_ACCOUNT_SUBDOMAIN was never set as a repo variable).
      # A failure here does not roll back the deploy -- Cloudflare
      # Workers has no built-in automatic rollback wired up here -- but
      # it does fail the workflow loudly instead of reporting green
      # while production is broken. See docs/DECISIONS.md (2026-08-17).
      #
      # Retries for up to 90s instead of a single check after a fixed
      # `sleep 8`: the first real run of this step (2026-08-17, deploying
      # the runtime-fs/dynamicParams fix itself) failed with HTTP 200 and
      # zero cards eight seconds after `wrangler deploy` reported success
      # -- while the exact same build's `npm run verify:worker` (real
      # local Workers runtime, moments earlier in the same job) passed
      # every check. That gap points at Cloudflare's global edge/cache
      # propagation lagging the deploy API response, not a code defect --
      # a single fixed-delay check can't tell the two apart, so it can't
      # be trusted to fail the workflow. See docs/DECISIONS.md (2026-08-17).
      - name: Verify the deployed Worker actually serves real races
        run: |
          URL="https://raceiq-web.bryan-7df.workers.dev/"
          DEADLINE=$((SECONDS + 90))
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            BODY=$(curl -s "$URL" || echo "")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            CACHE_STATUS=$(curl -s -o /dev/null -D - "$URL" | grep -i "^cf-cache-status:" | tr -d '\r' || true)
            CARD_COUNT=$(printf '%s' "$BODY" | grep -o "View Report" | wc -l | tr -d ' ')
            echo "Attempt $ATTEMPT: HTTP status $STATUS, $CARD_COUNT race card(s), ${CACHE_STATUS:-no cf-cache-status header}"
            if [ "$STATUS" = "200" ] && [ "$CARD_COUNT" -gt 0 ]; then
              echo "Deployed Worker responded 200 OK with $CARD_COUNT real race card(s) on the homepage after $ATTEMPT attempt(s)."
              exit 0
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              if [ "$STATUS" != "200" ]; then
                echo "::error::Deployed Worker still returning HTTP $STATUS instead of 200 after 90s."
              else
                echo "::error::Deployed homepage still returning HTTP 200 with zero race cards after 90s. This is the exact 2026-08-17 incident signature -- see docs/DECISIONS.md."
              fi
              exit 1
            fi
            sleep 10
          done

      # Phase 3, Part 1: the workers.dev check above verifies the Worker
      # itself; this verifies the actual public production domain visitors
      # use, since a healthy Worker and a correctly routed custom domain
      # are two different things (DNS, the Cloudflare custom-domain
      # attachment, and certificate provisioning can each fail
      # independently of the Worker deploy). See docs/DECISIONS.md
      # (2026-08-18).
      - name: Verify the production custom domain (homepage, archive, a race report, sitemap, robots, canonical/OG metadata)
        run: |
          BASE="https://raceiq.crouchdevelopment.com"
          fail=0

          check_200() {
            local label="$1" url="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "::error::$label ($url) returned HTTP $status instead of 200."
              fail=1
            else
              echo "OK: $label -> 200"
            fi
          }

          HOME_BODY=$(curl -s "$BASE/" || echo "")
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/" || echo "000")
          HOME_CARDS=$(printf '%s' "$HOME_BODY" | grep -o "View Report" | wc -l | tr -d ' ')
          if [ "$HOME_STATUS" != "200" ] || [ "$HOME_CARDS" -eq 0 ]; then
            echo "::error::Custom domain homepage ($BASE/) returned HTTP $HOME_STATUS with $HOME_CARDS race card(s)."
            fail=1
          else
            echo "OK: homepage -> 200 with $HOME_CARDS race card(s)"
          fi

          check_200 "archive" "$BASE/archive"
          check_200 "sitemap" "$BASE/sitemap.xml"
          check_200 "robots" "$BASE/robots.txt"

          SITEMAP_BODY=$(curl -s "$BASE/sitemap.xml" || echo "")
          SITEMAP_URL_COUNT=$(printf '%s' "$SITEMAP_BODY" | grep -o "<loc>" | wc -l | tr -d ' ')
          if [ "$SITEMAP_URL_COUNT" -lt 5 ]; then
            echo "::error::Sitemap only lists $SITEMAP_URL_COUNT URL(s) -- expected the 4 static pages plus 20 real races."
            fail=1
          elif printf '%s' "$SITEMAP_BODY" | grep -q "workers.dev"; then
            echo "::error::Sitemap contains a workers.dev URL -- it must only list the production custom domain."
            fail=1
          else
            echo "OK: sitemap lists $SITEMAP_URL_COUNT URL(s), no workers.dev references"
          fi

          FIRST_RACE_PATH=$(printf '%s' "$SITEMAP_BODY" | grep -o "<loc>[^<]*/race/[^<]*</loc>" | head -1 | sed -E 's#<loc>https?://[^/]+##; s#</loc>##')
          if [ -z "$FIRST_RACE_PATH" ]; then
            echo "::error::Could not find any /race/<year>/<event> URL in the sitemap to spot-check."
            fail=1
          else
            REPORT_BODY=$(curl -s "$BASE$FIRST_RACE_PATH" || echo "")
            REPORT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$FIRST_RACE_PATH" || echo "000")
            if [ "$REPORT_STATUS" != "200" ] || ! printf '%s' "$REPORT_BODY" | grep -qi "What Decided The Race"; then
              echo "::error::Race report $FIRST_RACE_PATH returned HTTP $REPORT_STATUS or was missing expected content."
              fail=1
            else
              echo "OK: race report $FIRST_RACE_PATH -> 200 with real content"
            fi
            if ! printf '%s' "$REPORT_BODY" | grep -q "rel=\"canonical\" href=\"$BASE"; then
              echo "::error::Race report $FIRST_RACE_PATH's canonical URL does not point at $BASE."
              fail=1
            else
              echo "OK: race report canonical URL points at $BASE"
            fi
            if ! printf '%s' "$REPORT_BODY" | grep -q "property=\"og:url\" content=\"$BASE"; then
              echo "::error::Race report $FIRST_RACE_PATH's og:url does not point at $BASE."
              fail=1
            else
              echo "OK: race report og:url points at $BASE"
            fi
            check_200 "race report OG image" "$BASE${FIRST_RACE_PATH}/opengraph-image"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more production custom-domain checks failed -- see above."
            exit 1
          fi
          echo "All production custom-domain checks passed."
